<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-label="Атом TerraMind">
  <defs>
    <radialGradient id="am-top" gradientUnits="userSpaceOnUse" cx="112" cy="36" r="96">
      <stop offset="0" stop-color="#f6fef9"/>
      <stop offset=".16" stop-color="#c9efda"/>
      <stop offset=".4" stop-color="#82d2ab"/>
      <stop offset=".66" stop-color="#3f9e6d"/>
      <stop offset="1" stop-color="#175737"/>
    </radialGradient>
    <radialGradient id="am-right" gradientUnits="userSpaceOnUse" cx="258" cy="126" r="80">
      <stop offset="0" stop-color="#f2fcf6"/>
      <stop offset=".18" stop-color="#c2ebd2"/>
      <stop offset=".44" stop-color="#79cb9f"/>
      <stop offset=".7" stop-color="#37945f"/>
      <stop offset="1" stop-color="#145133"/>
    </radialGradient>
    <radialGradient id="am-center" gradientUnits="userSpaceOnUse" cx="182" cy="186" r="92">
      <stop offset="0" stop-color="#eefaf2"/>
      <stop offset=".2" stop-color="#b9e8cc"/>
      <stop offset=".46" stop-color="#6cc494"/>
      <stop offset=".72" stop-color="#2f8a57"/>
      <stop offset="1" stop-color="#124b2f"/>
    </radialGradient>
    <radialGradient id="am-left" gradientUnits="userSpaceOnUse" cx="56" cy="262" r="128">
      <stop offset="0" stop-color="#f4fdf7"/>
      <stop offset=".16" stop-color="#c6edd7"/>
      <stop offset=".4" stop-color="#7fd0a4"/>
      <stop offset=".66" stop-color="#3d9c6a"/>
      <stop offset="1" stop-color="#165434"/>
    </radialGradient>
    <radialGradient id="am-bright" gradientUnits="userSpaceOnUse" cx="268" cy="312" r="98">
      <stop offset="0" stop-color="#f6fef9"/>
      <stop offset=".18" stop-color="#c9efda"/>
      <stop offset=".44" stop-color="#82d2ab"/>
      <stop offset=".7" stop-color="#3f9e6d"/>
      <stop offset="1" stop-color="#175737"/>
    </radialGradient>
    <filter id="am-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="am-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="am-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#03170d" flood-opacity="0.42"/>
    </filter>
  </defs>

  <g filter="url(#am-shadow)">
    <!-- connecting necks -->
    <g fill="none" stroke="#2e885a" stroke-width="98" stroke-linecap="round">
      <path d="M138 62 L205 212"/>
      <path d="M205 212 L280 150"/>
      <path d="M205 212 L90 298"/>
      <path d="M205 212 L292 342"/>
      <path d="M138 62 L280 150"/>
    </g>

    <!-- ambient occlusion in the notches -->
    <g fill="#0b3a22" opacity="0.34" filter="url(#am-blur)">
      <ellipse cx="232" cy="126" rx="26" ry="17" transform="rotate(38 232 126)"/>
      <ellipse cx="276" cy="268" rx="24" ry="16" transform="rotate(-52 276 268)"/>
      <ellipse cx="146" cy="246" rx="27" ry="18" transform="rotate(40 146 246)"/>
      <ellipse cx="168" cy="150" rx="22" ry="15" transform="rotate(-32 168 150)"/>
      <ellipse cx="228" cy="292" rx="22" ry="15" transform="rotate(8 228 292)"/>
    </g>

    <!-- spheres -->
    <circle cx="138" cy="62" r="62" fill="url(#am-top)"/>
    <circle cx="280" cy="150" r="52" fill="url(#am-right)"/>
    <circle cx="205" cy="212" r="64" fill="url(#am-center)"/>
    <circle cx="90" cy="298" r="88" fill="url(#am-left)"/>
    <circle cx="292" cy="342" r="68" fill="url(#am-bright)"/>

    <!-- glossy specular hits -->
    <g fill="#ffffff" opacity="0.62" filter="url(#am-soft)">
      <ellipse cx="112" cy="36" rx="17" ry="10" transform="rotate(-24 112 36)"/>
      <ellipse cx="259" cy="127" rx="12" ry="7" transform="rotate(-24 259 127)"/>
      <ellipse cx="58" cy="258" rx="23" ry="14" transform="rotate(-22 58 258)"/>
      <ellipse cx="268" cy="308" rx="16" ry="10" transform="rotate(-24 268 308)"/>
      <ellipse cx="181" cy="184" rx="14" ry="9" transform="rotate(-24 181 184)"/>
    </g>
  </g>
</svg>
